<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Worlds: a book of two websites</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--desk:#d9d0bf;--desk2:#bfb4a0;--ui:#2b241d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#26211b;--desk2:#0e0c0a;--ui:#e6dfd0}}
:root[data-theme="dark"]{--desk:#26211b;--desk2:#0e0c0a;--ui:#e6dfd0}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:radial-gradient(ellipse at 50% 40%,var(--desk),var(--desk2));color:var(--ui);font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
#stage{--pw:min(46vw,500px,calc((100vh - 130px)*.74));perspective:2600px;display:flex;justify-content:center}
.book{position:relative;width:calc(var(--pw)*2);height:calc(var(--pw)*1.34);transform-style:preserve-3d;transition:transform .9s cubic-bezier(.6,0,.2,1);filter:drop-shadow(0 28px 30px rgba(0,0,0,.35))}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.6,0,.2,1)}
.leaf.f{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;font-size:calc(var(--pw)/26)}
.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 9%)}
.back::after{background:linear-gradient(270deg,rgba(0,0,0,.28),rgba(0,0,0,0) 9%)}
.pg{height:100%;padding:2.4em 2.2em 2em 2.6em;display:flex;flex-direction:column;position:relative;line-height:1.5}
.back .pg{padding:2.4em 2.6em 2em 2.2em}
.pg h2,.pg h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.02;margin:0}
.pg h2{font-size:2.5em}
.pg p{margin:.7em 0 0;max-width:30em}
.pg i,.pg em{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.12em}
.pg a.btn{display:inline-block;margin-top:auto;padding:.7em 1.2em;border:1px solid currentColor;border-radius:99px;text-decoration:none;color:inherit;font-size:.82em;font-weight:500;align-self:flex-start;transition:background .2s,color .2s}
.pg a.btn:hover,.pg a.btn:focus-visible{background:var(--ac);color:var(--bg);border-color:var(--ac)}
/* page families */
.cover{--bg:#0b0d0c;--ac:#e3c77d;background:linear-gradient(115deg,#0b0d0c 0 48%,#e9e1cf 48.2% 100%);color:#e9e4d6;align-items:center;justify-content:center;text-align:center;border-radius:0 .5em .5em 0;padding:2em}
.cover .in{position:absolute;inset:1.3em;border:1px solid rgba(227,199,125,.55);mix-blend-mode:normal;pointer-events:none}
.cover h1{font-size:4.6em;color:#f4efe2;text-shadow:0 0 .4em rgba(0,0,0,.6)}
.cover h1 i{color:#e3c77d}
.cover .sun{width:7em;height:7em;border-radius:50%;margin:1.6em 0;background:radial-gradient(circle at 35% 35%,#fff7d8,#e3c77d 40%,#8a6d2f 75%);box-shadow:0 0 3em 1em rgba(227,199,125,.35)}
.cover small{letter-spacing:.2em;font-size:.72em;color:#e3c77d;position:relative}
.cover .hint{position:absolute;bottom:2.4em;color:#2b241d;font-size:.95em;right:2.4em}
.plain{--bg:#efe8d8;--ac:#6e5a35;background:#efe8d8;color:#2b241d}
.src{--bg:#0b0d0c;--ac:#e3c77d;background:#0b0d0c;color:#e9e4d6}
.src h2 i,.src h1 i{color:#e3c77d}
.fh{--bg:#f5f1e9;--ac:#7b4a22;background:#f5f1e9;color:#2b241d}
.fh h2 i{color:#7b4a22}
.plain h2,.fh h2{letter-spacing:-.01em}
/* contents */
.toc{list-style:none;padding:0;margin:1.6em 0 0}
.toc li{border-bottom:1px dotted rgba(43,36,29,.4);padding:.9em 0}
.toc button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;width:100%;gap:1em}
.toc button:focus-visible{outline:2px solid #6e5a35;outline-offset:3px}
.toc b{font-family:'Cormorant Garamond',serif;font-size:1.6em;font-weight:600}
.toc span{font-size:.82em;opacity:.7}
/* source visuals */
.neb{position:relative;flex:1;margin:1.2em 0 1em;border-radius:50% 50% .4em .4em/38% 38% .4em .4em;overflow:hidden;cursor:pointer;background:radial-gradient(ellipse at 30% 35%,rgba(120,90,200,.55),transparent 55%),radial-gradient(ellipse at 70% 60%,rgba(227,150,90,.45),transparent 55%),radial-gradient(ellipse at 50% 90%,rgba(60,140,150,.5),transparent 60%),#0f1114;box-shadow:inset 0 0 3em rgba(0,0,0,.7)}
.neb::before{content:"";position:absolute;inset:0;background:radial-gradient(1px 1px at 12% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 14%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 78%,#fff,transparent),radial-gradient(1px 1px at 22% 88%,#fff,transparent),radial-gradient(1px 1px at 62% 40%,#fff,transparent)}
.neb .t{position:absolute;left:0;right:0;top:46%;text-align:center;font-family:'Cormorant Garamond',serif;font-size:2.4em;font-style:italic;pointer-events:none;text-shadow:0 0 1em #000}
.spark{position:absolute;width:.5em;height:.5em;border-radius:50%;background:#fff3c4;box-shadow:0 0 1em .4em rgba(227,199,125,.8);transform:translate(-50%,-50%);animation:sp 1.8s ease-out forwards;pointer-events:none}
@keyframes sp{to{opacity:0;transform:translate(-50%,-140%) scale(2.4)}}
.mv{display:grid;gap:.9em;margin-top:1.3em}
.mv div{border-left:2px solid #e3c77d;padding-left:.9em}
.mv b{font-family:'Cormorant Garamond',serif;font-size:1.5em;font-weight:600}
.mv p{margin:.1em 0 0;opacity:.8;font-size:.92em}
.breath{width:3.6em;height:3.6em;border-radius:50%;margin:1.1em auto .3em;border:1px solid #e3c77d;box-shadow:0 0 1.6em rgba(227,199,125,.4);animation:br 8s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.5);background:rgba(227,199,125,.14)}}
/* first humans visuals */
.arch{position:relative;flex:1;margin:1.2em 0 1em;border-radius:50% 50% 0 0/32% 32% 0 0;overflow:hidden;background:linear-gradient(#f0d9a8,#e6b877 55%,#c98d4a)}
.arch .sun{position:absolute;left:50%;top:22%;width:30%;aspect-ratio:1;border-radius:50%;background:#fbf0d2;transform:translateX(-50%);box-shadow:0 0 2em #fbf0d2}
.arch .h1,.arch .h2{position:absolute;bottom:0}
.arch .h1{left:50%;width:100%;height:44%;background:#8a5a2c;border-radius:60% 0 0 0/80% 0 0 0;transform:translateX(-10%)}
.arch .h2{left:-10%;width:90%;height:34%;background:#5b3a1c;border-radius:0 70% 0 0/0 90% 0 0}
.fig{position:absolute;bottom:0;width:15%;height:44%;background:#2b1a0c;border-radius:45% 45% 0 0/30% 30% 0 0}
.fig::before{content:"";position:absolute;top:-34%;left:50%;width:62%;aspect-ratio:1;border-radius:50%;background:#2b1a0c;transform:translateX(-50%)}
.fig.a{left:34%}.fig.b{left:52%;height:38%;width:13%}
.arch .t{position:absolute;top:8%;width:100%;text-align:center;font-size:.8em;color:#5b3a1c;font-style:italic;font-family:'Cormorant Garamond',serif;font-size:1.1em}
.pts{display:grid;gap:1em;margin-top:1.3em}
.pts div{border-left:2px solid #7b4a22;padding-left:.9em}
.pts b{font-family:'Cormorant Garamond',serif;font-size:1.4em}
.pts p{margin:0;font-size:.92em;opacity:.85}
.tl{list-style:none;margin:1.4em 0 0;padding:0 0 0 1.4em;border-left:1px solid #7b4a22;display:grid;gap:1.1em}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-1.78em;top:.35em;width:.7em;height:.7em;border-radius:50%;background:#7b4a22}
.tl b{font-family:'Cormorant Garamond',serif;font-size:1.5em;display:block;line-height:1}
.tl span{font-size:.88em;opacity:.8}
.lab{margin-top:auto;padding:1em;border:1px dashed #7b4a22;border-radius:.4em;font-size:.88em}
.lab i{display:block;font-size:1.3em}
.two{display:grid;gap:.7em;margin-top:1.2em}
.two a.btn{margin:0;display:block;text-align:center;align-self:stretch;padding:.9em 1em}
/* controls */
.ctl{display:flex;align-items:center;gap:14px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem}
.ctl button{font:500 .85rem 'DM Sans',sans-serif;padding:.55em 1.1em;border-radius:99px;border:1px solid currentColor;background:transparent;color:var(--ui);cursor:pointer}
.ctl button:disabled{opacity:.3;cursor:default}
.ctl button:focus-visible{outline:2px solid var(--ui);outline-offset:3px}
/* mobile: pages in a swipe strip */
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;gap:4vw;padding:0 6vw;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .sp{--pw:min(88vw,calc((100vh - 130px)/1.34));flex:0 0 var(--pw);height:calc(var(--pw)*1.34);scroll-snap-align:center;position:relative;border-radius:.4em;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.strip .face{position:absolute;inset:0;font-size:calc(var(--pw)/26)}
.strip .back .pg{padding:2.4em 2.2em 2em 2.6em}
.strip .face::after{display:none}
@media (prefers-reduced-motion:reduce){.book,.leaf{transition-duration:.01s}.breath{animation:none}}
</style>
</head>
<body>
<div id="stage" aria-live="polite"></div>
<div class="ctl"><button id="prev">Previous</button><span id="pos"></span><button id="next">Next</button></div>
<script>
const link=(u,t)=>`<a class="btn" href="${u}" target="_blank" rel="noopener">${t}</a>`;
const SRC='https://yazanfattal.github.io/source-infinite/',FH='https://yazanfattal.github.io/first-humans/';
const P=[
/*0 cover*/`<div class="pg cover"><div class="in"></div><small>A BOOK OF TWO WEBSITES</small><h1>Two<br><i>Worlds</i></h1><div class="sun"></div><span style="position:relative;font-style:italic;font-family:'Cormorant Garamond',serif;font-size:1.3em">Source &amp; First Humans</span><span class="hint">Open the book ›</span></div>`,
/*1 contents*/`<div class="pg plain"><h2>Contents</h2><p>Two websites, one on the infinite and one on our beginnings. Choose a chapter.</p><ul class="toc"><li><button data-n="1" data-p="2"><b>I. Source</b><span>A glimpse of the infinite</span></button></li><li><button data-n="3" data-p="5"><b>II. First Humans</b><span>The story of us</span></button></li><li><button data-n="4" data-p="8"><b>III. Colophon</b><span>Visit both sites</span></button></li></ul></div>`,
/*2 source intro*/`<div class="pg src"><i style="color:#e3c77d">Chapter one</i><h1 style="font-size:5em;margin-top:.15em">Source</h1><i style="font-size:1.5em;opacity:.85">A glimpse of the infinite</i><h2 style="margin-top:auto;font-size:2.9em">You are here.<br>That is a <i>miracle.</i></h2><p>Of all the moments in all of existence, you get to be in this one.</p></div>`,
/*3 source visual*/`<div class="pg src"><i>A study in light</i><div class="neb" id="neb" title="Click to create a spark"><div class="t">Let there be light.</div></div><p style="margin:0">Tap the sky to create a spark, the same gesture the website invites.</p></div>`,
/*4 source moves*/`<div class="pg src"><h2>Three <i>movements</i></h2><div class="mv"><div><b>Creation</b><p>Creation is still happening. Light across a room, a seed opening in the dark.</p></div><div><b>Stillness</b><p>Even infinity takes a breath. One quiet minute, nothing to achieve.</p></div><div><b>Connection</b><p>Be someone’s little miracle. Small acts, boundless ripples.</p></div></div><div class="breath" aria-hidden="true"></div><div style="display:flex;gap:.6em;flex-wrap:wrap;margin-top:.6em">${link(SRC,'Enter Source ↗')}${link(SRC+'prayers.html','Prayer sky ✦')}</div></div>`,
/*5 fh visual*/`<div class="pg fh"><i>Chapter two</i><div class="arch" role="img" aria-label="Illustration of two early humans at sunrise on an African landscape"><div class="t">Artistic reconstruction</div><div class="sun"></div><div class="h1"></div><div class="h2"></div><div class="fig a"></div><div class="fig b"></div></div><h2 style="font-size:2.1em">≈300,000 years, <i>together</i></h2></div>`,
/*6 fh story*/`<div class="pg fh"><h2>A familiar face.<br>An ancient <i>story.</i></h2><p>Not one first person, but a whole human story that unfolded across populations and generations.</p><div class="pts"><div><b>Made in Africa</b><p>Our species emerged there around 300,000 years ago.</p></div><div><b>Already recognizably us</b><p>Upright bodies and familiar faces, changing gradually.</p></div><div><b>Evidence meets imagination</b><p>Bones and tools give clues; faces and clothing are interpreted.</p></div></div>${link(FH+'#discover','Meet the humans ↗')}</div>`,
/*7 fh timeline*/`<div class="pg fh"><h2>A past, pieced <i>together.</i></h2><ul class="tl"><li><b>Jebel Irhoud</b><span>Morocco · about 315,000 years ago</span></li><li><b>Omo Kibish</b><span>Ethiopia · at least about 230,000 years ago</span></li><li><b>Herto</b><span>Ethiopia · about 160,000 years ago</span></li></ul><div class="lab"><i>What if they lived today?</i>A thought experiment in thirty modern styles, in the FUN lab.</div></div>`,
/*8 colophon*/`<div class="pg plain"><h2>Colophon</h2><p>Source is an imagined doorway to the infinite. First Humans follows the evidence for early Homo sapiens, and says clearly where imagination begins.</p><div class="two">${link(SRC,'Open Source ↗')}${link(FH+'#discover','Open First Humans ↗')}</div><p style="margin-top:auto;font-style:italic;font-family:'Cormorant Garamond',serif;font-size:1.3em;text-align:center">Wherever you are, begin there.</p></div>`
];
const stage=document.getElementById('stage'),pos=document.getElementById('pos'),pv=document.getElementById('prev'),nx=document.getElementById('next');
const mq=matchMedia('(max-width:760px)'),L=4;
let n=0,book,leaves,strip,idx=0;
function build(){
  stage.innerHTML='';
  if(mq.matches){
    strip=document.createElement('div');strip.className='strip';
    strip.innerHTML=P.map(h=>`<section class="sp"><div class="face">${h}</div></section>`).join('');
    stage.style.perspective='none';stage.append(strip);
    strip.addEventListener('scroll',()=>{const w=strip.firstChild.getBoundingClientRect().width;idx=Math.round(strip.scrollLeft/(w+strip.clientWidth*.04));upd()},{passive:true});
    idx=0;book=null;
  }else{
    stage.style.perspective='';strip=null;
    book=document.createElement('div');book.className='book';
    book.innerHTML=`<div class="leaf" style="z-index:0"><div class="face">${P[8]}</div></div>`+Array.from({length:L},(_,i)=>`<div class="leaf" data-i="${i}"><div class="face">${P[2*i]}</div><div class="face back">${P[2*i+1]}</div></div>`).join('');
    stage.append(book);leaves=[...book.querySelectorAll('.leaf[data-i]')];n=0;set(0,true);
  }
  stage.querySelectorAll('.toc button').forEach(b=>b.onclick=()=>go(+b.dataset.n,+b.dataset.p));
  const neb=stage.querySelectorAll('.neb');
  neb.forEach(e=>e.addEventListener('click',ev=>{const r=e.getBoundingClientRect(),s=document.createElement('span');s.className='spark';s.style.left=(ev.clientX-r.left)+'px';s.style.top=(ev.clientY-r.top)+'px';e.append(s);setTimeout(()=>s.remove(),1800)}));
  upd();
}
function set(k,instant){
  n=Math.max(0,Math.min(L,k));
  leaves.forEach((l,i)=>{const f=i<n,was=l.classList.contains('f'),z=f?i+1:L-i;
    l.classList.toggle('f',f);
    if(was!==f){l.style.zIndex=50;setTimeout(()=>l.style.zIndex=z,instant?0:600)}else l.style.zIndex=z;
    l.querySelectorAll('a,button').forEach(x=>x.tabIndex=-1);});
  book.style.transform=n===0?'translateX(-25%)':'none';
  upd();
}
function go(a,b){mq.matches?strip.children[b].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}):set(a)}
function step(d){
  if(mq.matches){const c=strip.children[Math.max(0,Math.min(P.length-1,idx+d))];c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
  else set(n+d);
}
function upd(){
  const m=mq.matches;
  pv.disabled=m?idx<=0:n<=0;nx.disabled=m?idx>=P.length-1:n>=L;
  pos.textContent=m?(idx===0?'Cover':'Page '+idx+' of '+(P.length-1)):(n===0?'Cover':n===L?'The end':'Spread '+n+' of '+(L-1));
}
pv.onclick=()=>step(-1);nx.onclick=()=>step(1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
let sx=null;stage.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{if(sx===null||mq.matches)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)step(d<0?1:-1);sx=null});
mq.addEventListener('change',build);build();
</script>
</body>
</html>
